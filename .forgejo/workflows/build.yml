name: Build

on:
  push:
    branches:
      - "main"
    paths: &build-paths
      - ".forgejo/workflows/build.yml"
      - "gradle/**"
      - "src/**"
      - "versions/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "LICENSE"
      - "settings.gradle.kts"
      - "stonecutter.gradle.kts"
  pull_request:
    paths: *build-paths

permissions:
  contents: read

concurrency:
  group: build-${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: enhanced
          cache-read-only: ${{ forgejo.event_name != 'push' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build mod
        run: ./gradlew buildAll --build-cache --stacktrace
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""

      - name: Upload build artifacts
        if: ${{ !cancelled() && (forgejo.event_name != 'pull_request' || failure()) }}
        uses: forgejo/upload-artifact@v4
        with:
          name: DancingSquared-build-artifacts
          path: |
            versions/26.1.2/build/libs/DancingSquared-*26.1.2.jar
            versions/26.3/build/libs/DancingSquared-*26.3.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
