name: Build

on:
  push:
    branches: [main]
    paths: &build-paths
      - ".github/workflows/**"
      - ".forgejo/workflows/**"
      - "renovate.json"
      - "gradle/**"
      - "src/**"
      - "versions/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "LICENSE"
      - "settings.gradle.kts"
      - "stonecutter.gradle.kts"
  pull_request:
    paths: *build-paths
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set Up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name != 'push' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build All Minecraft Targets
        run: >-
          ./gradlew buildAll --no-daemon --no-parallel --no-build-cache --no-configuration-cache
          --rerun-tasks --stacktrace -Pkotlin.incremental=false
          -Pkotlin.compiler.execution.strategy=in-process

      - name: Analyze Code
        id: codeql
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:java-kotlin"
          output: ${{ runner.temp }}/codeql-results

      - name: Require Clean CodeQL Results
        env:
          CODEQL_RESULTS: ${{ steps.codeql.outputs.sarif-output }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          reports = list(Path(os.environ["CODEQL_RESULTS"]).glob("*.sarif"))
          if not reports:
              raise SystemExit("No CodeQL reports found; JAR uploads are blocked.")

          findings = 0
          for report in reports:
              data = json.loads(report.read_text())
              if data["version"] != "2.1.0" or not data["runs"]:
                  raise SystemExit("Invalid CodeQL report; JAR uploads are blocked.")
              for run in data["runs"]:
                  if run["tool"]["driver"]["name"] != "CodeQL" or not isinstance(run["results"], list):
                      raise SystemExit("Invalid CodeQL results; JAR uploads are blocked.")
                  findings += len(run["results"])

          if findings:
              raise SystemExit(f"CodeQL reported {findings} finding(s); JAR uploads are blocked. See Security > Code scanning.")
          print("CodeQL reported no findings. JAR uploads may proceed.")
          PY

      - name: Upload Minecraft 26.1.2 JAR
        if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/libs/26.1.2/DancingSquared-*.jar
          if-no-files-found: error
          archive: false
          retention-days: 90

      - name: Upload Minecraft 26.2 JAR
        if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/libs/26.2/DancingSquared-*.jar
          if-no-files-found: error
          archive: false
          retention-days: 90

      - name: Upload Minecraft 26.3 JAR
        if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/libs/26.3/DancingSquared-*.jar
          if-no-files-found: error
          archive: false
          retention-days: 90
