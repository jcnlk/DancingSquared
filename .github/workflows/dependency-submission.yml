name: Dependency submission

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dependency-submission.yml"
      - "gradle/**"
      - "versions/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: generate-and-submit
          # Reusing a configuration cache can skip dependency graph generation
          additional-arguments: --no-configuration-cache --stacktrace
          validate-wrappers: true
