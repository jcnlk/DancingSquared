version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "26.1.2"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      gradle-main:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "26.3"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      gradle-main:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "26.1.2"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-main:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "26.3"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-main:
        patterns:
          - "*"